<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Friday Kitchen and Food Waste</title>
  <desc id="desc">Restaurant kitchen with food-waste and energy issues marked.</desc>
  <rect width="1200" height="700" fill="#fee2e2" />
  <rect x="80" y="110" width="1040" height="510" rx="22" fill="#fff7ed" stroke="#9a3412" stroke-width="5" />
  <rect x="130" y="170" width="320" height="200" fill="#e2e8f0" stroke="#334155" />
  <text x="150" y="205" font-size="24" font-family="Arial" fill="#0f172a">Storage</text>
  <rect x="490" y="170" width="310" height="200" fill="#fef3c7" stroke="#334155" />
  <text x="510" y="205" font-size="24" font-family="Arial" fill="#0f172a">Prep Area</text>
  <rect x="840" y="170" width="240" height="200" fill="#dbeafe" stroke="#334155" />
  <text x="865" y="205" font-size="24" font-family="Arial" fill="#0f172a">Cooking</text>
  <rect x="130" y="405" width="300" height="160" fill="#fca5a5" />
  <text x="162" y="492" font-size="22" font-family="Arial" fill="#7f1d1d">Food waste pile</text>
  <circle cx="438" cy="432" r="14" fill="#ef4444" />
  <rect x="470" y="420" width="330" height="55" rx="10" fill="#94a3b8" />
  <text x="493" y="454" font-size="20" font-family="Arial" fill="#0f172a">Single-use plastic packaging</text>
  <circle cx="816" cy="439" r="14" fill="#ef4444" />
  <rect x="835" y="415" width="250" height="140" fill="#475569" />
  <text x="867" y="490" font-size="22" font-family="Arial" fill="#fff">No composting unit</text>
  <circle cx="1095" cy="438" r="14" fill="#ef4444" />
  <rect x="388" y="66" width="425" height="50" rx="10" fill="#7c2d12" />
  <text x="425" y="99" font-size="26" font-family="Arial" fill="#fff">EcoFix Restaurant Challenge</text>
  <text x="100" y="655" font-size="20" font-family="Arial" fill="#7c2d12">Daily food waste baseline: 40kg</text>
</svg>

