<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSwipe | Payments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="payment.js"></script>
</head>
<body class="app-body">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <header class="topbar panel">
      <div class="brand">
        <img src="assets/logo.svg" alt="EcoSwipe logo" class="logo" />
        <div>
          <h1 class="brand-title">EcoSwipe</h1>
          <p id="welcomeText">Payments</p>
        </div>
      </div>
      <div class="top-actions">
        <a href="/app" class="btn btn-ghost">Back to App</a>
        <a href="/database" class="btn btn-ghost">Database</a>
        <button id="logoutBtn" class="btn btn-ghost">Log Out</button>
      </div>
    </header>

    <main class="wide-main">
      <section class="panel">
        <h2>Complete Payments</h2>
        <p class="muted">Pay for booked services to unlock reviews and finalize confirmations.</p>
      </section>

      <section class="payment-grid">
        <article class="panel">
          <h3>Payment Form</h3>
          <form id="paymentForm" class="compact-form">
            <label>
              Booking
              <select id="bookingSelect"></select>
            </label>
            <label>
              Amount
              <input id="amountDisplay" type="text" readonly />
            </label>
            <label>
              Payment Method
              <select id="paymentMethod"></select>
            </label>
            <label>
              Payer Name
              <input id="payerName" type="text" minlength="2" maxlength="60" required placeholder="Name on payment" />
            </label>
            <label>
              Card / UPI Number
              <input id="cardNumber" type="text" minlength="12" maxlength="24" required placeholder="Enter payment number" />
            </label>
            <button class="btn" type="submit">Pay Now</button>
          </form>
        </article>

        <article class="panel">
          <h3>Payment History</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Transaction</th>
                  <th>Service</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Card Last4</th>
                  <th>Paid At</th>
                </tr>
              </thead>
              <tbody id="paymentRows"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
</body>
</html>
