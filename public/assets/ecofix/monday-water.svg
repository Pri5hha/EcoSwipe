<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Monday Household Water Waste</title>
  <desc id="desc">Flat cross-section of a Chennai home with highlighted water-waste issues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#ecfeff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)" />
  <rect x="90" y="110" width="1020" height="500" rx="22" fill="#f8fafc" stroke="#0f766e" stroke-width="5" />
  <rect x="120" y="150" width="500" height="220" fill="#e2e8f0" stroke="#334155" />
  <rect x="650" y="150" width="430" height="220" fill="#dbeafe" stroke="#334155" />
