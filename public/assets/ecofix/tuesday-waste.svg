<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tuesday Street Waste Management</title>
  <desc id="desc">Chennai street scene with waste-management issues highlighted.</desc>
  <rect width="1200" height="700" fill="#ecfccb" />
  <rect x="0" y="460" width="1200" height="240" fill="#334155" />
  <rect x="70" y="110" width="240" height="260" fill="#f8fafc" stroke="#334155" />
  <rect x="330" y="130" width="260" height="240" fill="#f1f5f9" stroke="#334155" />
  <rect x="620" y="95" width="220" height="275" fill="#f8fafc" stroke="#334155" />
  <rect x="870" y="125" width="260" height="245" fill="#f1f5f9" stroke="#334155" />
  <rect x="98" y="385" width="90" height="70" rx="8" fill="#cbd5e1" />
  <rect x="198" y="385" width="90" height="70" rx="8" fill="#cbd5e1" />
  <polygon points="520,430 560,380 600,430" fill="#f97316" />
  <rect x="760" y="400" width="90" height="55" fill="#a3a3a3" />
  <rect x="860" y="400" width="90" height="55" fill="#a3a3a3" />
