<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Wednesday Small Business Energy</title>
  <desc id="desc">Textile shop cross-section with major energy drains.</desc>
  <rect width="1200" height="700" fill="#e0f2fe" />
  <rect x="120" y="110" width="960" height="500" rx="20" fill="#f8fafc" stroke="#1e3a8a" stroke-width="5" />
  <rect x="170" y="180" width="400" height="360" fill="#fee2e2" stroke="#334155" />
  <rect x="610" y="180" width="420" height="360" fill="#e2e8f0" stroke="#334155" />
  <text x="188" y="215" font-size="24" font-family="Arial" fill="#0f172a">Retail Floor</text>
  <text x="628" y="215" font-size="24" font-family="Arial" fill="#0f172a">Back Office + AC Plant</text>
  <rect x="230" y="265" width="90" height="160" fill="#a78bfa" />
  <rect x="340" y="265" width="90" height="160" fill="#a78bfa" />
  <rect x="450" y="265" width="90" height="160" fill="#a78bfa" />
  <rect x="700" y="290" width="210" height="120" rx="10" fill="#93c5fd" />
  <text x="756" y="355" font-size="28" font-family="Arial" fill="#0c4a6e">16 C</text>
  <rect x="650" y="460" width="290" height="58" rx="10" fill="#334155" />

  <!-- Callouts rendered last so text is never hidden by scene blocks -->
  <circle cx="548" cy="300" r="14" fill="#ef4444" />
  <polyline points="562,300 598,260 690,260" fill="none" stroke="#ef4444" stroke-width="3" />
  <rect x="690" y="238" width="248" height="44" rx="10" fill="#fff1f2" stroke="#ef4444" />
  <text x="704" y="266" font-size="24" font-family="Arial" fill="#7f1d1d">Incandescent bulbs</text>

  <circle cx="925" cy="320" r="14" fill="#ef4444" />
  <line x1="939" y1="320" x2="956" y2="320" stroke="#ef4444" stroke-width="3" />
  <rect x="956" y="298" width="190" height="44" rx="10" fill="#fff1f2" stroke="#ef4444" />
  <text x="970" y="326" font-size="24" font-family="Arial" fill="#7f1d1d">AC set too low</text>

  <circle cx="952" cy="489" r="14" fill="#ef4444" />
  <line x1="966" y1="489" x2="981" y2="489" stroke="#ef4444" stroke-width="3" />
  <rect x="981" y="467" width="176" height="44" rx="10" fill="#fff1f2" stroke="#ef4444" />
  <text x="995" y="495" font-size="24" font-family="Arial" fill="#7f1d1d">Standby drain</text>
  <rect x="390" y="95" width="420" height="34" rx="8" fill="#ef4444" />
  <text x="415" y="120" font-size="20" font-family="Arial" fill="#fff">Monthly electricity: Rs 18,000</text>
  <text x="130" y="665" font-size="20" font-family="Arial" fill="#1e40af">Target: Cut energy spend by 50% in 3 fixes</text>
</svg>
