  <text x="80" y="665" font-size="20" font-family="Arial" fill="#166534">Tamil signboard zone | Waste load: 3x nearby streets</text>

  <!-- Callouts rendered last so labels remain readable -->
  <circle cx="300" cy="405" r="14" fill="#ef4444" />
  <line x1="314" y1="405" x2="330" y2="405" stroke="#ef4444" stroke-width="3" />
  <rect x="330" y="382" width="210" height="44" rx="10" fill="#fff1f2" stroke="#ef4444" />
  <text x="345" y="410" font-size="24" font-family="Arial" fill="#7f1d1d">No segregation</text>

  <circle cx="612" cy="401" r="14" fill="#ef4444" />
  <line x1="626" y1="401" x2="640" y2="401" stroke="#ef4444" stroke-width="3" />
  <rect x="640" y="378" width="190" height="44" rx="10" fill="#fff1f2" stroke="#ef4444" />
  <text x="655" y="406" font-size="24" font-family="Arial" fill="#7f1d1d">Open burning</text>

  <circle cx="962" cy="417" r="14" fill="#ef4444" />
  <line x1="976" y1="417" x2="994" y2="417" stroke="#ef4444" stroke-width="3" />
  <rect x="994" y="394" width="188" height="44" rx="10" fill="#fff1f2" stroke="#ef4444" />
