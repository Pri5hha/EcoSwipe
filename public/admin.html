<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSwipe | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="admin.js"></script>
</head>
<body class="app-body">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <header class="topbar panel">
      <div class="brand">
        <img src="assets/logo.svg" alt="EcoSwipe logo" class="logo" />
        <div>
          <h1 class="brand-title">EcoSwipe</h1>
          <p id="adminWelcome">Admin Console</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="badge-chip">Operations + Provider Intelligence</span>
        <a href="/" class="btn btn-ghost">Back to User Login</a>
        <button id="logoutBtn" class="btn btn-ghost">Log Out</button>
      </div>
    </header>

    <main class="wide-main admin-main">
      <section class="panel admin-kpi-panel">
        <h2>Admin Operations Hub</h2>
        <div id="adminKpis" class="kpi-grid"></div>
      </section>

      <section class="admin-layout">
        <article class="panel admin-queue-panel">
          <div class="admin-panel-head">
            <h3>Booking Acceptance Queue</h3>
            <label>
              View
              <select id="bookingView">
                <option value="pending">Pending Acceptance</option>
                <option value="approved">Approved</option>
                <option value="cancelled">Cancelled</option>
                <option value="paid">Paid</option>
                <option value="unpaid">Unpaid</option>
                <option value="all">All</option>
              </select>
            </label>
          </div>
          <div class="admin-queue-body">
            <p class="muted">Operations/Admin can approve or cancel bookings here. Users will instantly see booking status updates.</p>
            <div id="adminBookingQueue" class="bundle-list admin-scroll-list"></div>
          </div>
        </article>

        <article class="panel admin-analytics-panel">
          <div class="admin-panel-head">
            <h3>Provider Analytics Suite (Admin)</h3>
            <label>
              Window
              <select id="adminAnalyticsWindow">
                <option value="3">3 months</option>
                <option value="6" selected>6 months</option>
                <option value="12">12 months</option>
              </select>
            </label>
          </div>
          <div id="adminProviderGrowthKpis" class="provider-growth-kpis"></div>
          <div id="adminProviderGrowthActions" class="provider-growth-actions"></div>
          <section class="analytics-fold analytics-static">
            <button type="button" class="analytics-toggle" data-analytics-toggle aria-expanded="false">
              Match Swiping Funnel (Admin)
            </button>
            <div id="adminMatchFunnelList" class="funnel-list analytics-scroll"></div>
          </section>
          <section class="analytics-fold analytics-static">
            <button type="button" class="analytics-toggle" data-analytics-toggle aria-expanded="false">
              Demand Heatmap
            </button>
            <div id="adminProviderHeatmap" class="heatmap-grid analytics-scroll"></div>
          </section>
        </article>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
</body>
</html>
